<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PodGB</title>
<meta name="description" content="PodGB: cerca, iscriviti e ascolta podcast, anche offline.">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PodGB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn" id="backBtn" hidden aria-label="Indietro"></button>
    <h1 class="topbar-title" id="title">Novità</h1>
    <div class="topbar-actions" id="topActions"></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <section class="mini" id="mini" hidden aria-label="In riproduzione">
    <div class="mini-progress"><span id="miniBar"></span></div>
    <button class="mini-open" id="miniOpen" aria-label="Apri il player">
      <img class="mini-art art" id="miniArt" alt="">
      <span class="mini-text">
        <span class="mini-title" id="miniTitle"></span>
        <span class="mini-sub" id="miniSub"></span>
      </span>
    </button>
    <button class="icon-btn" id="miniBack" aria-label="Indietro di 15 secondi"></button>
    <button class="icon-btn play-btn" id="miniPlay" aria-label="Riproduci"></button>
  </section>

  <nav class="tabs" id="tabs" aria-label="Sezioni">
    <button data-tab="new" class="tab"><span data-icon="inbox"></span>Novità</button>
    <button data-tab="subs" class="tab"><span data-icon="grid"></span>Abbonamenti</button>
    <button data-tab="search" class="tab"><span data-icon="search"></span>Cerca</button>
    <button data-tab="queue" class="tab"><span data-icon="list"></span>Coda</button>
    <button data-tab="dl" class="tab"><span data-icon="download"></span>Scaricati</button>
  </nav>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet-scrim" data-action="close-sheet"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
